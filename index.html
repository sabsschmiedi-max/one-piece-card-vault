<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1324">
<title>One Piece Card Vault 0.4.5</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0b1324;--panel:#121d33;--text:#f6f8fb;--muted:#9eabc0;--accent:#36baff;--ok:#73dda7}
*{box-sizing:border-box}body{margin:0;background:#0b1324;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;padding:14px}
h1{font-size:25px;margin:8px 0 2px}.sub,.hint{color:var(--muted);font-size:12px;line-height:1.45}.panel{background:var(--panel);border:1px solid #263a58;border-radius:16px;padding:14px;margin-top:12px}
video,canvas.preview{width:100%;border-radius:12px;background:#050a12}.cameraWrap{position:relative}.guide{position:absolute;right:5%;bottom:26%;width:44%;height:13%;border:2px dashed #36baff;border-radius:8px;pointer-events:none;display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{flex:1;min-width:130px;padding:11px;border:0;border-radius:11px;font-weight:800;font:inherit}.primary{background:var(--accent);color:#03101a}.secondary{background:#243655;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px 2px}input{width:100%;padding:11px;background:#0d172a;color:white;border:1px solid #324866;border-radius:11px;font:inherit}
.progress{height:7px;background:#091321;border-radius:8px;overflow:hidden;margin-top:8px;display:none}.bar{height:100%;width:0;background:var(--accent)}
.result{margin-top:8px;font-size:13px}.ok{color:var(--ok)}.card{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #263a58}.info{flex:1}.qty{display:flex;align-items:center;gap:4px}.qty button{min-width:34px;padding:7px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}

.stickyScan{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:16px;
  z-index:9999;
  width:min(92vw,680px);
  padding:16px 18px;
  border:0;
  border-radius:16px;
  font-weight:900;
  font-size:18px;
  background:#36baff;
  color:#03101a;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
body{padding-bottom:92px}

</style>
</head>
<body><div class="app">
<h1>🏴‍☠️ One Piece Card Vault</h1>
<div class="sub">Version 0.4.7 · gezielte High-Res-Code-Erkennung</div>

<section class="panel">
<h2>📷 Scanner</h2>
<div class="cameraWrap">
<video id="video" autoplay playsinline></video>
<div id="guide" class="guide"></div>
</div>
<canvas id="canvas" hidden></canvas>
<canvas id="preview" class="preview" style="display:none"></canvas>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<div class="actions">
<button class="primary" id="openCam">Kamera öffnen</button>
<button class="secondary" id="pickPhoto">Foto wählen</button>
</div>
<div class="actions" id="camBtns" style="display:none">
<button class="primary" id="scanNow">Jetzt scannen</button>
<button class="secondary" id="closeCam">Schließen</button>
</div>
<div class="progress" id="prog"><div class="bar" id="bar"></div></div>
<div id="status" class="hint">Speed-Test: Nur die Kartennummer unten rechts muss im blauen Rahmen liegen.</div>
<div id="diag" class="hint" style="margin-top:5px;color:#73dda7">Diagnose: App bereit.</div>
</section>

<section class="panel">
<h2>🃏 Erkannte Karte</h2>
<div class="grid">
<div><label>Kartennummer</label><input id="number" placeholder="z. B. OP15-001"></div>
<div><label>Name</label><input id="name" placeholder="Name"></div>
<div><label>Set</label><input id="set" placeholder="OP15"></div>
<div><label>Seltenheit</label><input id="rarity" placeholder="C / UC / R / SR"></div>
<div><label>Anzahl hinzufügen</label><input id="addqty" type="number" min="1" value="1"></div>
<div><label>Notiz</label><input id="note" placeholder="optional"></div>
</div>
<div class="actions"><button class="primary" id="saveCard">➕ Speichern / +1</button></div>
<div id="lookup" class="result"></div>
</section>

<section class="panel">
<h2>🔎 Sammlung</h2>
<input id="search" placeholder="Suchen…">
<div id="list"></div>
</section>

<script>
let cards=JSON.parse(localStorage.getItem('opcv_cards')||'[]');
const $=id=>document.getElementById(id);
const video=$('video'), canvas=$('canvas'), preview=$('preview');
let stream=null;

function setStatus(s){$('status').textContent=s}
function diag(s){$('diag').textContent='Diagnose: '+s}
function prog(show,n=0){$('prog').style.display=show?'block':'none';$('bar').style.width=n+'%'}
function normalize(text){
  let raw=String(text||'').toUpperCase()
    .replace(/[—–_]/g,'-')
    .replace(/\s+/g,'')
    .replace(/[|]/g,'1');

  const fixDigits=x=>x
    .replace(/O/g,'0')
    .replace(/[IL]/g,'1')
    .replace(/S/g,'5')
    .replace(/B/g,'8')
    .replace(/Z/g,'2')
    .replace(/G/g,'6');

  // OCR kann OP z.B. als 0P, O?, QP oder nur P lesen.
  const candidates=[
    raw,
    raw.replace(/^0P/,'OP'),
    raw.replace(/^QP/,'OP'),
    raw.replace(/^P(?=[0-9OILSBZG]{2})/,'OP')
  ];

  for(const t of candidates){
    const m=t.match(/(?:OP|0P|QP)-?([0-9OILSBZG]{2})-?([0-9OILSBZG]{3})/);
    if(m){
      const n='OP'+fixDigits(m[1])+'-'+fixDigits(m[2]);
      if(isPlausibleMain(n)) return n;
    }
  }

  for(const pre of ['EB','ST','PRB']){
    const p=new RegExp(pre+'-?([0-9OILSBZG]{2})-?([0-9OILSBZG]{3})');
    const m=raw.match(p);
    if(m){
      const n=pre+fixDigits(m[1])+'-'+fixDigits(m[2]);
      if(isPlausibleMain(n)) return n;
    }
  }

  return '';
}

function isPlausibleMain(n){
  const m=n.match(/^(OP|EB|ST|PRB)(\d{2})-(\d{3})$/);
  if(!m) return false;

  const setNum=Number(m[2]);
  const cardNum=Number(m[3]);

  if(setNum < 1 || setNum > 99) return false;
  if(cardNum < 1 || cardNum > 300) return false;
  return true;
}

function isPlausible(n){
  if(/^P-\d{3}$/.test(n)) return true;
  const m=n.match(/^(OP|EB|ST|PRB)(\d{2})-(\d{3})$/);
  if(!m) return false;
  const setNum=Number(m[2]);
  const cardNum=Number(m[3]);
  if(setNum < 1 || setNum > 99) return false;
  if(cardNum < 1 || cardNum > 300) return false;
  return true;
}

async function startCam(){
  diag('Kamera-Button erkannt …');
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:3840},
        height:{ideal:2160},
        advanced:[{focusMode:'continuous'}]
      },
      audio:false
    });
    video.srcObject=stream;
    $('camBtns').style.display='flex';
    $('guide').style.display='block';
    setStatus('Kamera läuft. Bring die Kartennummer unten rechts ungefähr in den gut sichtbaren blauen Rahmen.');
    diag('Kamera geöffnet ✅');
  }catch(e){
    console.error(e);
    setStatus('Kamera konnte nicht geöffnet werden. Bitte Berechtigung erlauben oder „Foto wählen“ benutzen.');
    diag('Kamera-Fehler: '+(e && e.name ? e.name : 'unbekannt'));
  }
}
function stopCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;$('camBtns').style.display='none';$('guide').style.display='none';
}
function resetDetected(){
  $('number').value=''; $('set').value=''; $('lookup').textContent='';
}

function makeCrop(sourceCanvas,x,y,w,h,scale=4,mode='contrast'){
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*scale)); c.height=Math.max(1,Math.round(h*scale));
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(sourceCanvas,x,y,w,h,0,0,c.width,c.height);
  if(mode==='color') return c;
  const im=ctx.getImageData(0,0,c.width,c.height), d=im.data;
  for(let i=0;i<d.length;i+=4){
    const g=.299*d[i]+.587*d[i+1]+.114*d[i+2]; let v=g;
    if(mode==='contrast') v=g>155?255:(g<70?0:Math.round((g-70)*255/85));
    if(mode==='hard') v=g>135?255:0;
    if(mode==='invert') v=255-(g>155?255:(g<70?0:Math.round((g-70)*255/85)));
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(im,0,0); return c;
}

async function ocrCanvas(c,label,baseProgress){
  preview.width=c.width; preview.height=c.height;
  preview.getContext('2d').drawImage(c,0,0); preview.style.display='block';
  setStatus('OCR 0.4.7: '+label+' …'); diag('OCR läuft: '+label);
  const res=await Tesseract.recognize(c,'eng',{
    logger:m=>{if(m.progress)prog(true,Math.min(96,baseProgress+Math.round(m.progress*10)))}
  });
  return (res && res.data && res.data.text) ? res.data.text : '';
}


function rotateCanvas(src,deg){
  const rad=deg*Math.PI/180;
  const swap=deg%180!==0;
  const c=document.createElement('canvas');
  c.width=swap?src.height:src.width;
  c.height=swap?src.width:src.height;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.translate(c.width/2,c.height/2);
  ctx.rotate(rad);
  ctx.drawImage(src,-src.width/2,-src.height/2);
  return c;
}


function makeReadableCrop(sourceCanvas,x,y,w,h,scale=10){
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*scale));
  c.height=Math.max(1,Math.round(h*scale));
  const ctx=c.getContext('2d',{willReadFrequently:true});

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(sourceCanvas,x,y,w,h,0,0,c.width,c.height);

  const img=ctx.getImageData(0,0,c.width,c.height);
  const d=img.data;

  // Graustufen + moderater Kontrast, bewusst KEINE harte Schwarz-Weiß-Schwelle.
  for(let i=0;i<d.length;i+=4){
    let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];

    // leichte Kontrastspreizung um Mittelgrau
    g=(g-128)*1.35+128;

    // etwas aufhellen, damit dunkle kleine Schrift nicht "absäuft"
    g+=10;

    g=Math.max(0,Math.min(255,g));
    d[i]=d[i+1]=d[i+2]=g;
  }
  ctx.putImageData(img,0,0);
  return c;
}


async function captureHighResFrame(){
  if(!stream) throw new Error('Kamera ist nicht geöffnet.');
  const track=stream.getVideoTracks()[0];
  if(!track) throw new Error('Kein Video-Track verfügbar.');

  // Bevorzugt echtes hochauflösendes Standbild über ImageCapture.
  if('ImageCapture' in window){
    try{
      const cap=new ImageCapture(track);
      const blob=await cap.takePhoto();
      const bmp=await createImageBitmap(blob);
      const c=document.createElement('canvas');
      c.width=bmp.width;
      c.height=bmp.height;
      c.getContext('2d').drawImage(bmp,0,0);
      bmp.close?.();
      return c;
    }catch(e){
      console.warn('ImageCapture fallback:',e);
    }
  }

  // Fallback: voller Video-Frame in nativer Stream-Auflösung.
  const c=document.createElement('canvas');
  c.width=video.videoWidth;
  c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0,c.width,c.height);
  return c;
}


function makeCodeCrop(sourceCanvas,x,y,w,h,scale=6,mode='gray'){
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*scale));
  c.height=Math.max(1,Math.round(h*scale));
  const ctx=c.getContext('2d',{willReadFrequently:true});

  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(sourceCanvas,x,y,w,h,0,0,c.width,c.height);

  if(mode==='color') return c;

  const img=ctx.getImageData(0,0,c.width,c.height);
  const d=img.data;

  // Moderate grayscale contrast only; no destructive hard threshold.
  for(let i=0;i<d.length;i+=4){
    let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    g=(g-128)*1.55+128;
    g=Math.max(0,Math.min(255,g));
    d[i]=d[i+1]=d[i+2]=g;
  }
  ctx.putImageData(img,0,0);
  return c;
}

async function scanSource(sourceCanvas){
  resetDetected();
  prog(true,10);
  const started=performance.now();

  try{
    const W=sourceCanvas.width, H=sourceCanvas.height;
    setStatus('Gezielte Kartennummer-Erkennung läuft …');
    if($('diag')) $('diag').textContent='Diagnose: High-Res '+W+'×'+H+' · Code-Zone wird vorbereitet …';

    // 0.4.7: Guide-Mapping wieder als Orientierung verwenden,
    // aber den High-Res-Ausschnitt etwas großzügiger nehmen.
    const guideRect=$('guide').getBoundingClientRect();
    const videoRect=video.getBoundingClientRect();

    let nx=(guideRect.left-videoRect.left)/videoRect.width;
    let ny=(guideRect.top-videoRect.top)/videoRect.height;
    let nw=guideRect.width/videoRect.width;
    let nh=guideRect.height/videoRect.height;

    nx=Math.max(0,nx-0.08);
    ny=Math.max(0,ny-0.06);
    nw=Math.min(1-nx,nw+0.16);
    nh=Math.min(1-ny,nh+0.12);

    const liveAspect=(video.videoWidth&&video.videoHeight)
      ? video.videoWidth/video.videoHeight
      : videoRect.width/videoRect.height;
    const photoAspect=W/H;

    let baseX=0,baseY=0,baseW=W,baseH=H;
    if(photoAspect>liveAspect){
      baseW=H*liveAspect;
      baseX=(W-baseW)/2;
    }else if(photoAspect<liveAspect){
      baseH=W/liveAspect;
      baseY=(H-baseH)/2;
    }

    const gx=Math.max(0,baseX+nx*baseW);
    const gy=Math.max(0,baseY+ny*baseH);
    const gw=Math.min(W-gx,nw*baseW);
    const gh=Math.min(H-gy,nh*baseH);

    // Innerhalb dieser Zone sitzt die Kartennummer auf normalen OP-Karten
    // sehr weit unten/rechts. Diesen Teil vergrößern wir gezielt.
    const x=Math.max(0,gx+gw*0.28);
    const y=Math.max(0,gy+gh*0.48);
    const w=Math.min(W-x,gw*0.72);
    const h=Math.min(H-y,gh*0.52);

    const commonOpts={
      tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
      preserve_interword_spaces:'0'
    };

    let rawAll='';
    let found='';

    // Pass 1: Originalfarbe, kleine Code-Zone.
    const crop1=makeCodeCrop(sourceCanvas,x,y,w,h,6,'color');
    preview.width=crop1.width;
    preview.height=crop1.height;
    preview.getContext('2d').drawImage(crop1,0,0);
    preview.style.display='block';

    let res=await Tesseract.recognize(
      crop1,'eng',
      {logger:m=>{if(m.progress)prog(true,Math.min(60,12+Math.round(m.progress*45))) }},
      {...commonOpts,tessedit_pageseg_mode:'7'}
    );

    rawAll=(res.data.text||'').trim();
    found=normalize(rawAll);

    // Pass 2 nur wenn nötig: gleicher Ausschnitt, moderat kontrastiert.
    if(!found){
      const crop2=makeCodeCrop(sourceCanvas,x,y,w,h,6,'gray');
      preview.width=crop2.width;
      preview.height=crop2.height;
      preview.getContext('2d').drawImage(crop2,0,0);

      res=await Tesseract.recognize(
        crop2,'eng',
        {logger:m=>{if(m.progress)prog(true,Math.min(96,58+Math.round(m.progress*35))) }},
        {...commonOpts,tessedit_pageseg_mode:'7'}
      );

      rawAll+=' '+(res.data.text||'').trim();
      found=normalize(rawAll);
    }

    const elapsed=((performance.now()-started)/1000).toFixed(1);

    if(found){
      $('number').value=found;
      $('set').value=found.split('-')[0];
      $('lookup').innerHTML='<span class="ok">✅ Sicher erkannt: '+found+'</span>';
      setStatus('Kartennummer erkannt: '+found+' 🎉');
      if($('diag')) $('diag').textContent='Diagnose: High-Res '+W+'×'+H+' · Code-Zonen-OCR · '+elapsed+' s · Treffer ✅';
    }else{
      setStatus('Kein sicherer OP/EB/ST/PRB-Treffer in der Code-Zone.');
      if($('diag')) $('diag').textContent='Diagnose: High-Res '+W+'×'+H+' · Code-Zonen-OCR · '+elapsed+' s · kein sicherer Treffer';
    }
  }catch(e){
    const elapsed=((performance.now()-started)/1000).toFixed(1);
    console.error(e);
    setStatus('OCR-/Aufnahmefehler.');
    if($('diag')) $('diag').textContent='Diagnose: Fehler nach '+elapsed+' s · '+(e?.message||e);
  }finally{
    prog(false);
  }
}

async function scanLive(){
  if(!stream){
    setStatus('Bitte zuerst die Kamera öffnen.');
    return;
  }
  if($('diag')) $('diag').textContent='Diagnose: Hochauflösendes Standbild wird aufgenommen …';
  setStatus('High-Res-Aufnahme …');

  try{
    const hi=await captureHighResFrame();
    await scanSource(hi);
  }catch(e){
    console.error(e);
    setStatus('High-Res-Aufnahme fehlgeschlagen.');
    if($('diag')) $('diag').textContent='Diagnose: '+(e?.message||e);
  }
}

$('photo').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  resetDetected();
  const img=new Image();
  img.onload=()=>{
    canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
    canvas.getContext('2d').drawImage(img,0,0);
    scanSource(canvas);
  };
  img.src=URL.createObjectURL(f);
};

$('openCam').onclick=startCam;
$('closeCam').onclick=stopCam;
$('scanNow').onclick=scanLive;
$('pickPhoto').onclick=()=>$('photo').click();

$('saveCard').onclick=()=>{
  const c={number:$('number').value.trim().toUpperCase(),name:$('name').value.trim(),set:$('set').value.trim().toUpperCase(),rarity:$('rarity').value.trim(),qty:Math.max(1,+$('addqty').value||1),note:$('note').value.trim()};
  if(!c.number&&!c.name){alert('Bitte Kartennummer oder Name eingeben.');return}
  const old=c.number?cards.find(x=>(x.number||'').toUpperCase()===c.number):null;
  if(old){old.qty+=c.qty;if(c.name)old.name=c.name;if(c.set)old.set=c.set;if(c.rarity)old.rarity=c.rarity}
  else cards.push(c);
  localStorage.setItem('opcv_cards',JSON.stringify(cards));
  $('lookup').innerHTML='<span class="ok">Gespeichert ✅</span>';
  render();
};

function render(){
  const q=$('search').value.toLowerCase();
  const arr=cards.map((c,i)=>({...c,i})).filter(c=>[c.number,c.name,c.set].join(' ').toLowerCase().includes(q));
  $('list').innerHTML=arr.length?arr.map(c=>`<div class="card"><div class="info"><b>${c.name||'Unbekannt'}</b><div class="hint">${c.number||''} ${c.set?'· '+c.set:''}</div></div><div class="qty"><b>${c.qty}</b></div></div>`).join(''):'<div class="hint" style="padding:14px 0">Noch keine Karten.</div>';
}
$('search').oninput=render;
render();

try{
  window.addEventListener('load',()=>{
    if(typeof $==='function' && $('diag')){
      $('diag').textContent='Diagnose: Kamera-Button bereit ✅';
    }
  });
}catch(e){}

try{
  window.addEventListener('load',()=>{
    const b=$('stickyScan');
    if(b) b.onclick=scanLive;
  });
}catch(e){}
</script>
</div>
<button id="stickyScan" class="stickyScan">📷 JETZT SCANNEN</button>
</body></html>
